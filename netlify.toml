[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Handle all routes properly for Next.js
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200

# Add security headers for all routes
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https: https://image.pollinations.ai https://pollinations.ai; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co https://api.stripe.com https://generativelanguage.googleapis.com https://image.pollinations.ai https://pollinations.ai; frame-src https://js.stripe.com; worker-src 'self' blob:;"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=(), accelerometer=(), autoplay=(), clipboard-read=(), clipboard-write=(), fullscreen=*, magnetometer=(), payment=(), usb=()"rativelanguage.googleapis.com https://image.pollinations.ai https://pollinations.ai; frame-src https://js.stripe.com; worker-src 'self' blob:;"

# Restrictive CORS headers for API routes
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://docmagic1.netlify.app"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Access-Control-Allow-Credentials = "true"
    Access-Control-Max-Age = "86400"
